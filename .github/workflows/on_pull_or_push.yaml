name: On Pull Request or Push

on:
  pull_request:
  push:
    branches:
    - main
    - track/**

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install tox
      - run: tox -e lint

  scripts-unit:
    name: Scripts unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install tox
      - run: tox -e scripts-unit
