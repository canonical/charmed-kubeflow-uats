name: Update test images

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  IMAGES_FILE: assets/test.images.yaml
  # TODO: drop once test.images.txt is no longer consumed
  FLAT_IMAGES_FILE: assets/test.images.txt

jobs:
  update:
    name: Update test images (${{ matrix.base }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        base:
          - main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base }}
      - run: python3 -m pip install tox
      - run: tox -e update-images -- --file "$IMAGES_FILE" --flat-file "$FLAT_IMAGES_FILE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Import and configure the GPG key of the bot
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@92a10f995fd20944e1cae9a2e86e62dafe4f6171
        with:
          gpg_private_key: ${{ secrets.CHACI_GPG_PRIVATE }}
          passphrase: ${{ secrets.CHACI_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CHACI_GH_TOKEN }}
          author: ${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>
          committer: ${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>
          base: ${{ matrix.base }}
          branch: chore/update-test-images-${{ matrix.base }}
          commit-message: "chore: update test images"
          title: "chore: update test images (${{ matrix.base }})"
          body: |
            Automated update of `${{ env.IMAGES_FILE }}` (and its flat list
            `${{ env.FLAT_IMAGES_FILE }}`) from the charm repositories, generated by
            `tox -e update-images`.
          add-paths: |
            ${{ env.IMAGES_FILE }}
            ${{ env.FLAT_IMAGES_FILE }}
          delete-branch: true
