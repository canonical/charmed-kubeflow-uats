charms:
  argo-operators:
    repo: https://github.com/canonical/argo-operators
    branch: main
    images:
    - file: charms/argo-controller/config.yaml
      path: options.executor-image.default
      image: docker.io/charmedkubeflow/argoexec:3.7.17-71c8592-20261015075356
  katib-operators:
    repo: https://github.com/canonical/katib-operators
    branch: main
    images:
    - file: charms/katib-controller/src/default-custom-images.json
      path: metrics_collector_sidecar__file
      image: ghcr.io/kubeflow/katib/file-metrics-collector:v0.19.0
    - file: charms/katib-controller/src/default-custom-images.json
      path: default_trial_template_pytorch
      image: ghcr.io/kubeflow/katib/pytorch-mnist-cpu:v0.19.0
    - file: charms/katib-controller/src/default-custom-images.json
      path: suggestion__cmaes
      image: docker.io/charmedkubeflow/suggestion-goptuna:v0.19.0-3f14187
  kfp-operators:
    repo: https://github.com/canonical/kfp-operators
    branch: main
    images:
    - file: charms/kfp-api/config.yaml
      path: options.driver-image.default
      image: docker.io/charmedkubeflow/kfp-driver:2.16.0-cffd968
    - file: charms/kfp-api/config.yaml
      path: options.launcher-image.default
      image: docker.io/charmedkubeflow/kfp-launcher:2.16.0-212e71b
    - file: charms/kfp-profile-controller/src/default-custom-images.json
      path: frontend
      image: docker.io/charmedkubeflow/frontend:2.16.0-c9e8334
    - file: charms/kfp-profile-controller/src/default-custom-images.json
      path: visualization_server
      image: docker.io/charmedkubeflow/visualization-server:2.16.0-9756a03
  kserve-operators:
    repo: https://github.com/canonical/kserve-operators
    branch: main
    images:
    - file: charms/kserve-controller/src/default-custom-images.json
      path: serving_runtimes__sklearnserver
      image: docker.io/charmedkubeflow/sklearnserver:0.17.0-5f4a278-20260825092927
    - file: charms/kserve-controller/src/default-custom-images.json
      path: configmap__storageInitializer
      image: docker.io/charmedkubeflow/storage-initializer:0.17.0-07d37fb
  metacontroller-operator:
    repo: https://github.com/canonical/metacontroller-operator
    branch: main
    images:
    - file: config.yaml
      path: options.metacontroller-image.default
      image: docker.io/charmedkubeflow/metacontroller:4.11.22-899b4ff-20261101041051
  training-operator:
    repo: https://github.com/canonical/training-operator
    branch: main
    images:
    - file: config.yaml
      path: options.training-operator-image.default
      image: docker.io/charmedkubeflow/training-operator:1.9.3-ed2f593-20260909084108
static:
- docker.io/kubeflow/tf-mnist-with-summaries:latest
- docker.io/kubeflowkatib/pytorch-mnist-cpu:v0.16.0
- docker.io/library/alpine:3.10
- docker.io/library/busybox:1.36
- docker.io/library/python:3.11
- docker.io/paddlepaddle/paddle:2.4.0rc0-cpu
- ghcr.io/canonical/charmed-spark-jupyterlab:3.5-22.04_stable
- ghcr.io/canonical/charmed-spark:3.5.5-22.04_edge
- ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-scipy:v1.10.0
